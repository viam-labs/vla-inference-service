[project]
name = "viam-vla-inference-service"
version = "0.1.0"
description = "Run pre-trained LeRobot VLA policies on Viam machines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # 0.82: first release with `Arm.move_through_joint_positions_streamed`.
    "viam-sdk>=0.85.2",
    "numpy>=2.0.0,<2.3.0",
    "pillow>=10.0.0",
    # Rotation algebra for action_space="delta-ee" (src/vla/controller/pose.py).
    # A core dependency, not part of the `lerobot` extra: the controller runs
    # the pose composition itself and can be deployed on a machine that never
    # loads a checkpoint (the policy service may live elsewhere).
    "scipy>=1.11",
]

[project.optional-dependencies]
lerobot = [
    # Direct deps so [tool.uv.sources] below applies (uv ignores sources for transitive deps).
    "torch",
    "torchvision",
    "lerobot[smolvla,evo1,diffusion,pi,cosmos3] @ git+https://github.com/huggingface/lerobot@02655292cdadd7dd2f8fc5daa31a7437b44354ee",
]

[dependency-groups]
# pytest-asyncio >=1.0: asyncio_default_test_loop_scope only exists from 0.26.
# On older versions pytest merely warns about the unknown key, and the
# module-scoped async fixture in Task 19 then fails with a cross-loop error.
dev = ["pytest>=8.0.0", "pytest-asyncio>=1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
testpaths = ["tests"]
markers = [
    "integration: requires a real checkpoint and torch (deselect with '-m \"not integration\"')",
    "differential: requires lerobot installed to compare against upstream",
]

[tool.hatch.metadata]
# Required: hatchling refuses to build ANY project whose metadata declares a
# PEP 508 direct reference (the `lerobot @ git+https://...` pin) without this,
# and it validates all declared extras during a plain `uv sync` even though
# that sync never installs them.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/vla"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# torch/torchvision from the CUDA 12.8 index on Linux, as lerobot <= ff7cc3de configured it.
# lerobot 02655292c moved to PyPI wheels (CUDA 13, higher driver floor); keeping cu128 holds the
# module's runtime unchanged across the pin bump. Jetson still swaps in sm_87 wheels in setup.sh.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
